<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout :: layout(~{::title}, ~{::section})">

<head>
    <title>Admin Panel</title>
</head>

<section>

    <div class="max-w-7xl mx-auto px-6 pt-10 pb-8">
        <h2 class="text-3xl font-bold text-white" style="font-family: 'Georgia', serif;">Admin Dashboard</h2>
        <p class="text-gray-300" style="font-family: 'Georgia', serif;">Manage system data</p>
    </div>

    <div class="max-w-7xl mx-auto px-6 pb-16">

        <div th:if="${error}"
             class="bg-red-500 bg-opacity-70 text-white p-3 rounded mb-4"
             style="font-family: 'Georgia', serif;">
            <span th:text="${error}"></span>
        </div>

        <!-- USERS TABLE -->
        <div class="bg-white bg-opacity-10 backdrop-blur-md border border-white border-opacity-20 p-6 rounded-xl shadow-lg mb-10">
            <h3 class="text-xl font-semibold mb-4 text-white" style="font-family: 'Georgia', serif;">Users</h3>

            <table class="w-full text-left" style="font-family: 'Georgia', serif;">
                <thead class="bg-white bg-opacity-10">
                <tr>
                    <th class="p-3">User ID</th>
                    <th class="p-3">Name</th>
                    <th class="p-3">Email</th>
                    <th class="p-3">Role</th>
                    <th class="p-3">Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}"
                    class="border-b border-white border-opacity-10 hover:bg-white hover:bg-opacity-5 transition">
                    <td class="p-3" th:text="${user.userId}"></td>
                    <td class="p-3" th:text="${user.name}"></td>
                    <td class="p-3" th:text="${user.email}"></td>
                    <td class="p-3" th:text="${user.role}"></td>
                    <td class="p-3">
                        <form method="post" action="/admin/users/delete">
                            <input type="hidden" name="userId" th:value="${user.userId}">
                            <button class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded transition"
                                    style="font-family: 'Georgia', serif;">
                                Delete
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- ROOMS TABLE -->
        <div class="bg-white bg-opacity-10 backdrop-blur-md border border-white border-opacity-20 p-6 rounded-xl shadow-lg mb-10">
            <h3 class="text-xl font-semibold mb-4 text-white" style="font-family: 'Georgia', serif;">Rooms</h3>

            <table class="w-full text-left mb-6" style="font-family: 'Georgia', serif;">
                <thead class="bg-white bg-opacity-10">
                <tr>
                    <th class="p-3">Room ID</th>
                    <th class="p-3">Type</th>
                    <th class="p-3">Price</th>
                    <th class="p-3">Available</th>
                    <th class="p-3">Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="room : ${rooms}"
                    class="border-b border-white border-opacity-10 hover:bg-white hover:bg-opacity-5 transition">
                    <td class="p-3" th:text="${room.roomId}"></td>
                    <td class="p-3" th:text="${room.type}"></td>
                    <td class="p-3" th:text="${room.price}"></td>
                    <td class="p-3" th:text="${room.available} ? 'Yes' : 'No'"></td>
                    <td class="p-3">
                        <div class="flex gap-2 items-center">
                            <form method="post" action="/admin/rooms/update" class="flex gap-1 items-center">
                                <input type="hidden" name="roomId" th:value="${room.roomId}">
                                <input type="number" step="0.01" name="price" th:value="${room.price}"
                                       style="font-family: 'Georgia', serif;"
                                       class="w-20 p-1 rounded bg-white bg-opacity-10 border border-white border-opacity-20 text-white">
                                <select name="available"
                                        style="font-family: 'Georgia', serif;"
                                        class="p-1 rounded bg-white bg-opacity-10 border border-white border-opacity-20 text-white">
                                    <option value="true" class="bg-gray-800" th:selected="${room.available}">Yes</option>
                                    <option value="false" class="bg-gray-800" th:selected="${!room.available}">No</option>
                                </select>
                                <button class="bg-blue-600 hover:bg-blue-700 px-3 py-1 rounded transition"
                                        style="font-family: 'Georgia', serif;">
                                    Update
                                </button>
                            </form>
                            <form method="post" action="/admin/rooms/delete">
                                <input type="hidden" name="roomId" th:value="${room.roomId}">
                                <button class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded transition"
                                        style="font-family: 'Georgia', serif;">
                                    Delete
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>

            <!-- ADD ROOM FORM -->
            <div class="bg-white bg-opacity-10 border border-white border-opacity-20 p-4 rounded-lg">
                <h4 class="text-lg font-semibold mb-3 text-white" style="font-family: 'Georgia', serif;">Add New Room</h4>
                <form method="post" action="/admin/rooms/add" class="flex flex-wrap gap-3 items-end">

                    <div>
                        <label class="block text-sm text-gray-300 mb-1" style="font-family: 'Georgia', serif;">Room ID</label>
                        <input type="text" name="roomId" required
                               style="font-family: 'Georgia', serif;"
                               class="p-2 rounded bg-white bg-opacity-10 border border-white border-opacity-20 text-white">
                    </div>

                    <div>
                        <label class="block text-sm text-gray-300 mb-1" style="font-family: 'Georgia', serif;">Type</label>
                        <input type="text" name="type" required
                               style="font-family: 'Georgia', serif;"
                               class="p-2 rounded bg-white bg-opacity-10 border border-white border-opacity-20 text-white">
                    </div>

                    <div>
                        <label class="block text-sm text-gray-300 mb-1" style="font-family: 'Georgia', serif;">Price</label>
                        <input type="number" step="0.01" name="price" required
                               style="font-family: 'Georgia', serif;"
                               class="p-2 rounded bg-white bg-opacity-10 border border-white border-opacity-20 text-white">
                    </div>

                    <button class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded transition"
                            style="font-family: 'Georgia', serif;">
                        Add Room
                    </button>

                </form>
            </div>
        </div>

        <!-- BOOKINGS TABLE -->
        <div class="bg-white bg-opacity-10 backdrop-blur-md border border-white border-opacity-20 p-6 rounded-xl shadow-lg">
            <h3 class="text-xl font-semibold mb-4 text-white" style="font-family: 'Georgia', serif;">Bookings</h3>

            <table class="w-full text-left" style="font-family: 'Georgia', serif;">
                <thead class="bg-white bg-opacity-10">
                <tr>
                    <th class="p-3">Booking ID</th>
                    <th class="p-3">User ID</th>
                    <th class="p-3">Room ID</th>
                    <th class="p-3">Check In</th>
                    <th class="p-3">Check Out</th>
                    <th class="p-3">Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="booking : ${bookings}"
                    class="border-b border-white border-opacity-10 hover:bg-white hover:bg-opacity-5 transition">
                    <td class="p-3" th:text="${booking.bookingId}"></td>
                    <td class="p-3" th:text="${booking.userId}"></td>
                    <td class="p-3" th:text="${booking.roomId}"></td>
                    <td class="p-3" th:text="${booking.checkInDate}"></td>
                    <td class="p-3" th:text="${booking.checkOutDate}"></td>
                    <td class="p-3" th:text="${booking.status}"></td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>

</section>
</html>
