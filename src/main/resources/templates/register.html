<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout :: layout(~{::title}, ~{::section})">

<head>
  <title>Register</title>
</head>

<section class="flex justify-center items-center min-h-[70vh]">

  <div class="bg-white bg-opacity-10 backdrop-blur-md border border-white border-opacity-20 p-8 rounded-xl shadow-lg w-full max-w-md">

    <h2 class="text-2xl font-bold text-center mb-6 text-white"
        style="font-family: 'Georgia', serif;">
      Create an Account
    </h2>

    <div th:if="${error}"
         class="bg-red-500 bg-opacity-70 text-white p-3 rounded mb-4 text-center"
         style="font-family: 'Georgia', serif;">
      <span th:text="${error}"></span>
    </div>

    <form method="post" action="/register" class="space-y-4">

      <input type="text" name="userId" placeholder="User ID" required
             style="font-family: 'Georgia', serif;"
             class="w-full p-3 rounded-lg bg-white bg-opacity-10 border border-white border-opacity-20 text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-white focus:ring-opacity-40">

      <input type="text" name="name" placeholder="Full Name" required
             style="font-family: 'Georgia', serif;"
             class="w-full p-3 rounded-lg bg-white bg-opacity-10 border border-white border-opacity-20 text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-white focus:ring-opacity-40">

      <input type="email" name="email" placeholder="Email" required
             style="font-family: 'Georgia', serif;"
             class="w-full p-3 rounded-lg bg-white bg-opacity-10 border border-white border-opacity-20 text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-white focus:ring-opacity-40">

      <input type="password" name="password" placeholder="Password" required
             style="font-family: 'Georgia', serif;"
             class="w-full p-3 rounded-lg bg-white bg-opacity-10 border border-white border-opacity-20 text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-white focus:ring-opacity-40">

      <select name="role"
              style="font-family: 'Georgia', serif;"
              class="w-full p-3 rounded-lg bg-white bg-opacity-10 border border-white border-opacity-20 text-white focus:outline-none focus:ring-2 focus:ring-white focus:ring-opacity-40">
        <option value="Customer" class="bg-gray-800">Customer</option>
      </select>

      <button type="submit"
              style="font-family: 'Georgia', serif;"
              class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded-lg font-semibold transition">
        Register
      </button>

    </form>

    <p class="text-gray-300 text-center mt-4" style="font-family: 'Georgia', serif;">
      Already have an account?
      <a href="/login" class="text-white hover:underline">Login</a>
    </p>

  </div>

</section>
</html>
