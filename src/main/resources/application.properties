spring.application.name=hotel-res
server.port=8080

# MySQL connection. Override these environment variables on your machine.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_reservation?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# The database is created by database/schema.sql.
spring.sql.init.mode=never
