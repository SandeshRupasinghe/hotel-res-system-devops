services:

  mysql:
    image: mysql:8.4
    container_name: hotel-mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: hotel_reservation
    volumes:
      - ./database/setup.sql:/docker-entrypoint-initdb.d/01-setup.sql:ro
      - hotel_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  hotel-app:
    image: ${HOTEL_IMAGE:-hotel-res-system:1.0.0}
    container_name: hotel-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/hotel_reservation?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: ""
    ports:
      - "8081:8080"
    restart: unless-stopped

volumes:
  hotel_mysql_data:
